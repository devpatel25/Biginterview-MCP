[project]
name = "resumeai-mcp"
version = "0.0.1"
description = "MCP server giving an AI agent access to Big Interview ResumeAI via Playwright"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3",
    "playwright>=1.45,<2",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumeai_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
